version: '3.8'

services:
  app:
    build: .
    container_name: real-estate-app
    ports:
      - "3006:3006"
    environment:
      - MAPBOX_ACCESS_TOKEN=${MAPBOX_ACCESS_TOKEN}
    command: npm run preview -- --host --port 3006
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3006"]
      interval: 10s
      timeout: 5s
      retries: 5

  puppeteer-integration-tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: puppeteer-tests
    depends_on:
      app:
        condition: service_healthy
    environment:
      - APP_URL=http://app:3006
    volumes:
      - ./test-results:/app/test-results
    command: npm run test
